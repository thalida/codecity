<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCity</title>
  </head>
  <body>
    <header id="app-header">
      <div id="app-title"></div>
    </header>
    <main id="app-body">
      <div id="tree-sidebar"></div>
      <div id="center-pane">
        <canvas id="city"></canvas>
        <!-- Fly-mode crosshair. Inside #center-pane so it tracks the
             canvas center (where pickAtCenter raycasts from) rather
             than the viewport center, which drifts off when sidebars
             open/close. -->
        <div id="fly-reticle" aria-hidden="true"></div>
      </div>
      <div id="sidebar"></div>
    </main>
    <footer id="app-footer"></footer>

    <!-- Three.js is fetched from CDN at open-time (not bundled). Cached by the
       browser across codecity runs. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>

    <div id="source-picker-root" style="display: none;"></div>
    <div id="loading-overlay-root" style="display: none;"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
