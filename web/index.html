<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCity</title>
  </head>
  <body>
    <header id="app-header">
      <button
        id="toggle-left-sidebar"
        type="button"
        class="app-header-icon"
        aria-label="Hide left sidebar"
        title="Hide left sidebar"
      ></button>
      <div id="app-title"></div>
      <button
        id="toggle-right-sidebar"
        type="button"
        class="app-header-icon"
        aria-label="Hide right sidebar"
        title="Hide right sidebar"
      ></button>
    </header>
    <main id="app-body">
      <div id="tree-sidebar"></div>
      <div id="center-pane">
        <canvas id="city"></canvas>
      </div>
      <div id="sidebar"></div>
    </main>
    <footer id="app-footer"></footer>

    <!-- Three.js is fetched from CDN at open-time (not bundled). Cached by the
       browser across codecity runs. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
