# Contributor-only: Vite HMR + api auto-reload. Each package defines its own
# service; this file combines them and owns the wiring. Run via `just dev`.
include:
  - packages/api/docker-compose.dev.yml
  - packages/app/docker-compose.dev.yml

services:
  app:
    environment:
      - VITE_API_PROXY=http://api:8000
    depends_on:
      api:
        condition: service_healthy
