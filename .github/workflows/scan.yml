name: Weekly Trivy Scan

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write # to open an issue on new findings
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy on :latest
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/codecity:latest
          format: json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0 # don't fail; we open an issue instead
          output: trivy-results.json

      - name: Check for findings
        id: findings
        # jq is preinstalled on ubuntu-latest runners. Parse Trivy's JSON
        # rather than grepping the table format — robust against upstream
        # rendering changes.
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-results.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on findings
        if: steps.findings.outputs.found == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const json = JSON.parse(fs.readFileSync('trivy-results.json', 'utf8'));
            const vulns = (json.Results || []).flatMap(r => r.Vulnerabilities || []);
            const summary = vulns
              .map(v => `- **${v.Severity}** ${v.VulnerabilityID} in ${v.PkgName}@${v.InstalledVersion}: ${v.Title}`)
              .join('\n');
            // One CVE usually lands in several packages, so count the distinct
            // ids: `3 CVEs` for one openssl advisory sends you looking for three.
            const ids = new Set(vulns.map(v => v.VulnerabilityID));
            const n = `${ids.size} HIGH/CRITICAL ${ids.size === 1 ? 'CVE' : 'CVEs'}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Trivy scan: ${n} in codecity:latest (${new Date().toISOString().split('T')[0]})`,
              body: `Weekly scan found ${n} across ${vulns.length} package(s) in the published image.\n\nrefresh.yml rebuilds \`:latest\` against a fresh base two hours before this scan, so these survived a rebuild: either that run failed, or they need a real dependency change rather than fresher OS packages.\n\n${summary}`,
              labels: ['security', 'dependencies'],
            });
