name: Weekly Trivy Scan

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write       # to open an issue on new findings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy on :latest
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/codecity:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0    # don't fail; we open an issue instead
          output: trivy-results.txt

      - name: Check for findings
        id: findings
        run: |
          if grep -q 'Total:' trivy-results.txt && ! grep -q 'Total: 0' trivy-results.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue on findings
        if: steps.findings.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('trivy-results.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Trivy scan: HIGH/CRITICAL CVEs in codecity:latest (${new Date().toISOString().split('T')[0]})`,
              body: `Weekly scan found HIGH/CRITICAL CVEs in the published image. Time to rebuild against a fresh base.\n\n\`\`\`\n${results}\n\`\`\``,
              labels: ['security', 'dependencies'],
            });
