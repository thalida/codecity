name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    # A release publishes an image and now deploys production, so only the repo
    # owner's tags trigger it. This is the second line of defence: the first is
    # a tag ruleset restricting who can create `v*` at all, which stops the tag
    # rather than the run. Anyone with write access could otherwise cut a
    # release by pushing a tag.
    if: github.actor == github.repository_owner
    permissions:
      contents: write # for creating the GitHub Release
      packages: write # for pushing to GHCR
      id-token: write # for cosign keyless signing via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for hatch-vcs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag info
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          MAJOR=${VERSION%%.*}
          MINOR_AND_PATCH=${VERSION#${MAJOR}.}
          MINOR=${MINOR_AND_PATCH%%.*}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codecity:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/codecity:v${{ steps.tag.outputs.major }}.${{ steps.tag.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/codecity:v${{ steps.tag.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/codecity:latest
            ghcr.io/${{ github.repository_owner }}/codecity:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A cached runtime layer pins its apt-get upgrade to the day it was
          # first built, which would publish CVEs apt could already fix.
          no-cache-filters: runtime
          pull: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless via OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/codecity@${{ steps.build.outputs.digest }}

      - name: Smoke test the published image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/codecity:${{ steps.tag.outputs.tag }}
          docker run --rm -d --name smoke --init -p 18080:8080 \
            ghcr.io/${{ github.repository_owner }}/codecity:${{ steps.tag.outputs.tag }}
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{ .State.Health.Status }}' smoke 2>/dev/null)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          curl -sf http://localhost:18080/api/health
          docker stop smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            Docker image: `ghcr.io/${{ github.repository_owner }}/codecity:${{ steps.tag.outputs.tag }}`

            Verify signature:
            ```
            cosign verify \
              --certificate-identity-regexp 'https://github.com/${{ github.repository_owner }}/codecity/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ghcr.io/${{ github.repository_owner }}/codecity:${{ steps.tag.outputs.tag }}
            ```

  deploy:
    name: Deploy to production
    needs: [release]
    runs-on: ubuntu-latest
    # The image has to exist before the deploy pulls it, so this waits on the
    # release job rather than running alongside it. Skipped when the Forgejo
    # target isn't configured, so a fork's release still succeeds.
    #
    # Host and repo are secrets, not variables: this repo is public, so its
    # Actions logs are too, and only secrets are masked in them. Nothing here
    # echoes either one.
    steps:
      - name: Dispatch the Forgejo deploy workflow
        env:
          FORGEJO_HOST: ${{ secrets.FORGEJO_HOST }}
          FORGEJO_REPO: ${{ secrets.FORGEJO_REPO }}
          FORGEJO_DEPLOY_APP: ${{ vars.FORGEJO_DEPLOY_APP }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ -z "$FORGEJO_HOST" ] || [ -z "$FORGEJO_REPO" ] || [ -z "$FORGEJO_TOKEN" ]; then
            echo "::notice::Forgejo deploy not configured (FORGEJO_HOST/FORGEJO_REPO/FORGEJO_TOKEN secrets) — skipping"
            exit 0
          fi
          APP="${FORGEJO_DEPLOY_APP:-app-codecity}"
          echo "Dispatching $APP"
          CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            "$FORGEJO_HOST/api/v1/repos/$FORGEJO_REPO/actions/workflows/deploy.yml/dispatches" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"app\":\"$APP\"}}")
          if [ "$CODE" != "204" ] && [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "::error::Forgejo returned $CODE"; cat /tmp/resp; exit 1
          fi
          echo "Deploy queued on the Forgejo instance"
