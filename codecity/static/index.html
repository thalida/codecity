<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCity</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" crossorigin src="./assets/index-BeRZRe3z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-KXLWRH4q.css">
  </head>
  <body>
    <header id="app-header">
      <button
        id="app-header-up"
        type="button"
        class="app-header-icon"
        aria-label="Up one level"
        title="Up one level"
      ></button>
      <div id="app-title"></div>
      <button
        id="app-header-reset"
        type="button"
        class="app-header-icon"
        aria-label="Reset view"
        title="Reset view"
      ></button>
    </header>
    <main id="app-body">
      <div id="tree-sidebar"></div>
      <div id="center-pane">
        <canvas id="city"></canvas>
      </div>
      <div id="sidebar"></div>
    </main>
    <footer id="app-footer"></footer>

    <!-- Three.js is fetched from CDN at open-time (not bundled). Cached by the
       browser across codecity runs. -->


  </body>
</html>
