# Contributor-only test compose: pytest + vitest in containers.
#
# Run via `just test` / `just test-api` / `just test-app`.
services:
  pytest:
    image: codecity:test
    build:
      context: .
    # The runtime image was built with `uv sync --no-dev`, so pytest isn't in
    # /srv/.venv. Re-sync at container start (without --no-dev) to add the
    # `dev` dependency group, then run pytest from the same venv.
    #
    # `user: root` is required because the venv was created by root during the
    # image build (Dockerfile runs `uv sync` before `USER codecity`), so the
    # non-root runtime user can't write to it. This is a test-only ephemeral
    # container (--rm), not production — root is acceptable here.
    user: 'root'
    init: true
    # The trailing `"--"` becomes `$0` to the sh -c script, so extra args
    # passed via `docker compose run --rm pytest <args>` propagate to pytest
    # through `"$@"`. Without this, `sh -c` silently drops them (e.g. CI's
    # `--cov-report=xml:...` flag — no xml emitted, upload-artifact warns
    # "no files found").
    entrypoint:
      ['sh', '-c', 'uv sync --frozen && exec /srv/.venv/bin/python -m pytest -v "$@"', '--']
    environment:
      # A couple of tests in packages/api/api/tests/test_scan.py shell out to `git commit`
      # to test cache invalidation. On a developer's host this works via
      # ~/.gitconfig; in a fresh container there's no identity. Provide one.
      - GIT_AUTHOR_NAME=Test Runner
      - GIT_AUTHOR_EMAIL=test@codecity.local
      - GIT_COMMITTER_NAME=Test Runner
      - GIT_COMMITTER_EMAIL=test@codecity.local
    volumes:
      # `./packages/api/api` is read-write (not :ro) because several tests in
      # its tests/test_scan.py mutate tests/fixtures/sample-repo/ (writing
      # cache-bust files, modifying tracked files to test stat-cache
      # invalidation). They clean up via addCleanup, but they need write
      # access. The manifests are read-only — they never change at runtime.
      - './packages/api/api:/srv/api'
      - './packages/api/uv.lock:/srv/uv.lock:ro'
      - './packages/api/pyproject.toml:/srv/pyproject.toml:ro'

  # Python's `npm run lint` + `prettier --check` in one service: `ruff check`
  # is the linter, `ruff format --check` the formatter. Lint first so a real
  # error isn't hidden behind a formatting diff. Read-only mounts: it only
  # verifies, never writes (use `just fmt` to apply). Re-syncs to add the dev
  # dependency group (ruff).
  ruff:
    image: codecity:test
    build:
      context: .
    user: 'root'
    init: true
    entrypoint:
      [
        'sh',
        '-c',
        'uv sync --frozen && /srv/.venv/bin/ruff check api && /srv/.venv/bin/ruff check --isolated /work/bin /work/scripts && /srv/.venv/bin/ruff format --check api && exec /srv/.venv/bin/ruff format --isolated --check /work/bin /work/scripts "$@"',
        '--',
      ]
    volumes:
      - './packages/api/api:/srv/api:ro'
      # bin/ and scripts/ sit ABOVE the api project, so they get stock ruff
      # (--isolated below). Mounted outside /srv so config resolution matches
      # the host, where no pyproject sits above them either.
      - './bin:/work/bin:ro'
      - './scripts:/work/scripts:ro'
      - './packages/api/uv.lock:/srv/uv.lock:ro'
      - './packages/api/pyproject.toml:/srv/pyproject.toml:ro'

  # Python's `npm run typecheck`. pyproject.toml sets strict mode over the package.
  #
  # Run as `python -m pyright` from the synced venv (like the pytest service)
  # so pyright resolves fastapi/pydantic from that venv rather than guessing an
  # interpreter. PYRIGHT_PYTHON_FORCE_VERSION is pinned because the pip package
  # is a launcher that otherwise downloads whatever pyright is newest at run
  # time — an unpinned typechecker means the gate can turn red on a day nobody
  # pushed. The launcher fetches its own node, so the cache is a named volume:
  # downloaded once, not per run (same reason as the npm cache below).
  #
  # libatomic1: that fetched node links against it and python:3.13-slim doesn't
  # ship it, so node dies with "libatomic.so.1: cannot open shared object file".
  # Installed here rather than in the Dockerfile — the production image has no
  # business carrying a dependency only the typechecker needs. Same reason the
  # vitest service installs libexpat1 for node-canvas.
  pyright:
    image: codecity:test
    build:
      context: .
    user: 'root'
    init: true
    entrypoint:
      [
        'sh',
        '-c',
        'apt-get update >/dev/null && apt-get install -y --no-install-recommends libatomic1 >/dev/null && uv sync --frozen && exec /srv/.venv/bin/python -m pyright "$@"',
        '--',
      ]
    environment:
      - PYRIGHT_PYTHON_FORCE_VERSION=${PYRIGHT_VERSION:-1.1.409}
    volumes:
      - './packages/api/api:/srv/api:ro'
      - './packages/api/uv.lock:/srv/uv.lock:ro'
      - './packages/api/pyproject.toml:/srv/pyproject.toml:ro'
      - 'codecity-test-pyright-cache:/root/.cache/pyright-python'

  # Regenerates the TS types from a schema `just gen-types` already wrote to
  # .local/, and diffs. Its own service because it needs the app's node_modules
  # and the repo root together, and vitest only mounts the app.
  gentypes:
    image: node:24-bookworm-slim
    working_dir: /repo/packages/app
    init: true
    command: sh -c "npm install -g npm@${NPM_VERSION:-11.6.2} && npm ci && npx openapi-typescript ../../.local/openapi.generated.json -o /tmp/fresh.ts && diff -u src/types/manifest.generated.ts /tmp/fresh.ts"
    volumes:
      - '.:/repo'
      - '/repo/packages/app/node_modules'
      - 'codecity-test-npm-cache:/root/.npm'

  # city/ gets no service of its own — it is a typecheck and a format check.
  # Prettier lives inside each package now, so nothing at the repo root formats
  # anything, and README/AGENTS/compose/workflows are deliberately unformatted:
  # they belong to no package.
  packages:
    image: node:24-bookworm-slim
    working_dir: /repo
    init: true
    command: sh -c "npm install -g npm@${NPM_VERSION:-11.6.2} && cd /repo/packages/city && npm ci && npm run typecheck && npm run format:check"
    volumes:
      # Not :ro — same fresh-clone mountpoint problem as vitest. Checks never write.
      - '.:/repo'
      - '/repo/packages/city/node_modules'
      - 'codecity-test-npm-cache:/root/.npm'

  vitest:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    # Pin npm to host version to match the lockfile shape (see Dockerfile
    # for the same workaround). NPM_VERSION is loaded from the repo-root
    # .env file by compose; fallback keeps this working if .env is missing.
    #
    # The `canvas` package's prebuilt binary requires `libexpat1` from the
    # system (jsdom delegates `getContext('2d')` to node-canvas, and several
    # scene tests exercise that path). Fontconfig + DejaVu fonts are also
    # required so labelAtlas text measurements match real-browser widths —
    # without them, a pagination test that depends on text overflowing one
    # 8192-tall page fails because measurements come back too narrow.
    #
    # Reliability: canvas's prebuilt .node download can flake and fall back to a
    # node-gyp source build that fails in this slim image. Mitigations: cache the
    # prebuilt in named volumes (fetched once, reused) and retry `npm ci`.
    command: sh -c "apt-get update >/dev/null && apt-get install -y --no-install-recommends libexpat1 fontconfig fonts-dejavu-core >/dev/null && npm install -g npm@${NPM_VERSION:-11.6.2} && (npm ci || (sleep 3 && npm ci) || (sleep 6 && npm ci)) && npm test"
    volumes:
      # Not :ro — Docker can't mkdir the /app/node_modules mountpoint under a
      # read-only parent mount on a fresh checkout (no existing node_modules
      # dir to overlay on). Vitest tests are pure-functional and don't write
      # to source.
      - './packages/app:/app'
      # The app depends on @codecity/city, whose workspace link and vite alias
      # both resolve to /app/../city. Mounted as a sibling so both still land.
      - './packages/city:/city'
      - '/city/node_modules'
      - '/app/node_modules' # anonymous volume — npm-installed in container
      - 'codecity-test-npm-cache:/root/.npm' # persist npm + prebuild-install cache
      - 'codecity-test-node-cache:/root/.cache' # prebuild-install may cache here too

# Named caches so canvas's prebuilt binary and pyright's bundled node are
# downloaded once, not per push.
volumes:
  codecity-test-npm-cache:
  codecity-test-node-cache:
  codecity-test-pyright-cache:
