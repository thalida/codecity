[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "codecity"
dynamic = ["version"]
description = "Visualize any codebase as an isometric 3D city"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "hachoir>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.scripts]
codecity = "api.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["api"]
exclude = ["api/tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=4",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-ra --strict-markers -n auto --cov=api --cov-report=term --cov-fail-under=80"

[tool.pyright]
include = ["api"]
exclude = ["api/tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.coverage.run]
source = ["api"]
omit = ["api/tests/*", "api/__main__.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
