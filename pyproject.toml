[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "codecity"
dynamic = ["version"]
description = "Visualize any codebase as an isometric 3D city"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "hachoir>=3.3",
    "watchfiles>=0.22",
]

[project.scripts]
codecity = "api.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["api"]
exclude = ["api/tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-ra --strict-markers -n auto"

[tool.pyright]
include = ["api"]
exclude = ["api/tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
